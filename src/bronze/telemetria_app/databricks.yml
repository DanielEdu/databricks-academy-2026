# This is a Declarative Automation Bundle definition for telemetria_app.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: telemetria_app
  uuid: c9efba2a-f984-4e74-b03e-1795cda807b4

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  table:
    description: Target Bronze table name
    default: eventos_app
  kafka_topic:
    description: Event Hubs (Kafka-compatible) topic to subscribe to
    default: wizard.lending.eventos-app
  checkpoint_path:
    description: Root ABFSS path used for the streaming checkpoint
    default: abfss://checkpoints@stecopocdeveastus001.dfs.core.windows.net/

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405604560792122.2.azuredatabricks.net
    variables:
      catalog: bronze_dev
      schema: telemetria_app
  prod:
    mode: production
    workspace:
      host: https://adb-7405604560792122.2.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/daniel.portugal@talentoparati.com to make sure we only have a single copy.
      root_path: /Workspace/Users/daniel.portugal@talentoparati.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bronze_dev
      schema: telemetria_app
    permissions:
      - user_name: daniel.portugal@talentoparati.com
        level: CAN_MANAGE

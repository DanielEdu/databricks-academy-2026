# Ingests each source table from the ADLS landing layer into Unity Catalog Bronze
# using Auto Loader. One task per table, all running the same parameterized
# notebook (../src/ingest_autoloader.py).

resources:
  jobs:
    adls_landing_to_bronze:
      name: adls_landing_to_bronze

      schedule:
        quartz_cron_expression: "0 0 0 * * ?" # Every day at 12:00 AM
        timezone_id: "America/Lima"
        pause_status: UNPAUSED

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: source
          default: cobranzas
        - name: landing_path
          default: ${var.landing_path}
        - name: checkpoint_path
          default: ${var.checkpoint_path}

      tasks:
        - task_key: cuotas
          notebook_task:
            notebook_path: ../src/ingest_autoloader.py
            base_parameters:
              table: cuotas

        - task_key: gestiones_cobranza
          notebook_task:
            notebook_path: ../src/ingest_autoloader.py
            base_parameters:
              table: gestiones_cobranza

        - task_key: pagos
          notebook_task:
            notebook_path: ../src/ingest_autoloader.py
            base_parameters:
              table: pagos

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

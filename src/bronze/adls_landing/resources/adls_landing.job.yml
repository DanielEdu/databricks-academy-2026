# Ingests each source table from the ADLS landing layer into Unity Catalog Bronze
# using Auto Loader. Two tasks per table: a DDL task (../src/create_bronze_tables.py)
# that creates the table explicitly (all columns STRING + standardized control
# columns) if it does not exist yet, followed by the ingestion task
# (../src/ingest_autoloader.py) that Auto Loader appends to.

resources:
  jobs:
    adls_landing_to_bronze:
      name: adls_landing_to_bronze

      schedule:
        quartz_cron_expression: "0 0 0 * * ?" # Every day at 12:00 AM
        timezone_id: "America/Lima"
        pause_status: PAUSED

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: source
          default: cobranzas
        - name: landing_path
          default: ${var.landing_path}
        - name: checkpoint_path
          default: ${var.checkpoint_path}

      tasks:
        - task_key: ddl_cuotas
          notebook_task:
            notebook_path: ../src/create_bronze_tables.py
            base_parameters:
              table: cuotas

        - task_key: cuotas
          depends_on:
            - task_key: ddl_cuotas
          notebook_task:
            notebook_path: ../src/ingest_autoloader.py
            base_parameters:
              table: cuotas

        - task_key: ddl_gestiones_cobranza
          notebook_task:
            notebook_path: ../src/create_bronze_tables.py
            base_parameters:
              table: gestiones_cobranza

        - task_key: gestiones_cobranza
          depends_on:
            - task_key: ddl_gestiones_cobranza
          notebook_task:
            notebook_path: ../src/ingest_autoloader.py
            base_parameters:
              table: gestiones_cobranza

        - task_key: ddl_pagos
          notebook_task:
            notebook_path: ../src/create_bronze_tables.py
            base_parameters:
              table: pagos

        - task_key: pagos
          depends_on:
            - task_key: ddl_pagos
          notebook_task:
            notebook_path: ../src/ingest_autoloader.py
            base_parameters:
              table: pagos

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

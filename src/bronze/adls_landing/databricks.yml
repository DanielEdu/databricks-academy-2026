# This is a Declarative Automation Bundle definition for adls_landing.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: adls_landing
  uuid: b771fd9d-efb6-4878-be2e-761463ae75fa

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  landing_path:
    description: Root ABFSS path of the landing layer in ADLS
    default: abfss://landing@stecopocdeveastus001.dfs.core.windows.net/
  checkpoint_path:
    description: Root ABFSS path used for Auto Loader checkpoints and schema location
    default: abfss://checkpoints@stecopocdeveastus001.dfs.core.windows.net/

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405604560792122.2.azuredatabricks.net
    variables:
      catalog: bronze_dev
      schema: cobranzas
  prod:
    mode: production
    workspace:
      host: https://adb-7405604560792122.2.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/daniel.portugal@talentoparati.com to make sure we only have a single copy.
      root_path: /Workspace/Users/daniel.portugal@talentoparati.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bronze_dev
      schema: cobranzas
    permissions:
      - user_name: daniel.portugal@talentoparati.com
        level: CAN_MANAGE
